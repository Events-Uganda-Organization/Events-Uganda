# ─── Prod Profile ─────────────────────────────────────
# Database configuration for Render PostgreSQL
# Note: Render DATABASE_URL is in postgres:// format (not JDBC).
# Use individual env vars instead to construct a proper JDBC URL with SSL.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT secret (min 32 chars for HMAC-SHA256)
jwt.secret=${JWT_SECRET}

