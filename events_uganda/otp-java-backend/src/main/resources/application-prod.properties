# ─── Prod Profile ─────────────────────────────────────
# Database configuration for Render/Neon PostgreSQL
# Supports Render/Neon style (DATABASE_*) and Railway style (PG*) variables
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:${PGHOST}}:${DATABASE_PORT:${PGPORT}}/${DATABASE_NAME:${PGDATABASE}}?sslmode=require
spring.datasource.username=${DATABASE_USERNAME:${PGUSER}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD}}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT secret (min 32 chars for HMAC-SHA256)
jwt.secret=${JWT_SECRET}

# Mail configuration (configure with environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
