# ─── Server ───────────────────────────────────────────
server.port=${PORT:8080}

# ─── Active Profile ───────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Flyway ───────────────────────────────────────────
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── Uploads ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
# Keep uploads in memory so they never touch a temp file (max-file-size is
# 8MB, so no valid upload ever hits disk, avoiding temp-dir failures on
# cloud hosts like Render).
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.location=${TEMP_DIR:/tmp}
